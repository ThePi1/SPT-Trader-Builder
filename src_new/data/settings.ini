# Settings for the SPT Quest Builder.
# These can also be changed in the app, from Settings > Settings...
# true / false entries take true or false. Other entries need no quotes.

[general]
# Write a detailed log (spt_builder.log, next to the program) for troubleshooting.
debug_logging = false

# Exporting quests: true adds their text to an existing locale file you choose;
# false writes the text to a locale file of its own.
merge_locales_on_export = true

# Exporting quests: also write the text into every other language's locale file.
copy_locale_to_all_languages = false

[data]
# Your SPT_Data/database folder. Empty uses the copy included with the program.
database_folder =

# Language used for item and trader names (en, ru, de, ...).
language = en

[defaults]
quest_icon = /files/quest/icon/6137505384aedf00fa17b651.jpg
side = Pmc
trader =

[display]
show_all_fields = false
show_json_preview = false

[updates]
# Change these only if you fork the project.
version_file = data/version.txt
version_url = https://raw.githubusercontent.com/ThePi1/SPT-Trader-Builder/main/src/data/version.txt
project_url = https://github.com/ThePi1/SPT-Trader-Builder
