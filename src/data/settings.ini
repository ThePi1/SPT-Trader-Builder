# Settings
# For true/false entries, put either True, or False. No quotes. Not case sensitive. You can even say 'on' / 'off', if you're crazy.
# For all other settings (strings or numbers) no need to put any quotes. Just the number or the string.
#
# These settings can also be edited in the app, from Settings > Edit Settings...
#
# The lists that fill the dropdown menus (skills, locations, body parts, etc.) live in data/box_fields.json.
# To add a custom trader, edit data/traders.json and add the corresponding mongoID.

[general]
# Write a detailed log (trader_builder.log, next to the program) for troubleshooting. true or false.
debug_logging = false

# What exporting quests does with their locale (the quest and task text). true or false.
# true: choose an existing locale file, add the entries it doesn't have yet (the ones it has are kept), then choose where to save it.
# false: save the quests' entries to a locale file of their own (nothing is merged).
merge_locales_on_export = true

[filepaths]
# Filepaths for data files used -- edit if needed, but you shouldn't have to
version_file = data/version.txt

# The item database (items.json) used by the ID Lookup tab and the child-item finder. By default this is the
# one included with the program; choose a different one (say, from your SPT install) in Settings.
# A relative path is relative to the program folder.
items_file = data/items.json

# Project URLs - change if forking the project
version_url = https://raw.githubusercontent.com/ThePi1/SPT-Trader-Builder/main/src/data/version.txt
project_url = https://github.com/ThePi1/SPT-Trader-Builder

[defaults]
default_questicon = /files/quest/icon/6137505384aedf00fa17b651.jpg
