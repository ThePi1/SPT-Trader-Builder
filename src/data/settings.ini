# Settings for the SPT Trader Builder.
# These can also be changed in the app, from Settings > Settings...
# true / false entries take true or false. Other entries need no quotes.

[general]
# Write a detailed log (spt_trader_builder.log, next to the program) for troubleshooting.
debug_logging = false

# When saving the locale file, also add the text of the open quests to the other languages' files in the same folder
# (en.json, ru.json, ...). Entries those files already have are kept. true or false.
copy_locale_to_all_languages = false

# Save normally writes to the file a section was opened from or last saved to. true asks for a file name every time instead.
save_asks_for_file = false

# When the program starts, open the quest, locale, trader assort and quest assort files that were open when it was last
# closed. It asks the same questions as File > Open (which trader an assort is for). Imported files are not reopened. true or false.
load_last_files = true
enable_debug_options = true

[data]
# Your SPT_Data/database folder. Empty uses the copy included with the program.
database_folder =

# Language used for item and trader names (en, ru, de, ...).
language = en

[defaults]
quest_icon = /files/quest/icon/6137505384aedf00fa17b651.jpg
side = Pmc
trader =

[display]
show_all_fields = false
show_json_preview = true
# Grey out the uncommon fields (the ones under More options) in the Schema Explorer's field tables. true or false.
mark_uncommon_fields = false
problems_collapsed = false

[lists]
# The most entries each list shows (10 to 100000). Search to narrow a list down; a bigger number is slower.
# The Locale tab.
locale_max_entries = 5000
# Find IDs, and the windows that search for an id.
lookup_max_rows = 7000
# The Problems list under the quests.
problems_max_shown = 900
# The results of Schema Explorer > Check a file.
explorer_max_problems = 500

[updates]
# Change these only if you fork the project.
version_file = data/version.txt
version_url = https://raw.githubusercontent.com/ThePi1/SPT-Trader-Builder/main/src/data/version.txt
project_url = https://github.com/ThePi1/SPT-Trader-Builder
